<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Case Opener{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="topnav">
  <a href="{{ url_for('cases_page') }}" class="topnav-brand">Case Opener</a>
  <div class="topnav-links">
    <a href="{{ url_for('cases_page') }}" class="{{ 'active' if active_page == 'cases' else '' }}">Cases</a>
    <a href="{{ url_for('custom_page') }}" class="{{ 'active' if active_page == 'custom' else '' }}">Build your own</a>
  </div>
</nav>

<div class="page">
{% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
